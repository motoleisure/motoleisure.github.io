  <style>
    .reader-band { background: var(--page-tint); padding: 3rem 0 4rem; min-height: 60vh; }
    .reader-head { display: flex; align-items: flex-start; gap: 1.4rem; flex-wrap: wrap; }
    .reader-cover { width: 7rem; border-radius: .6rem; border: 1px solid var(--hairline); box-shadow: 0 10px 24px -14px rgba(0,23,46,.4); flex: none; }
    .reader-meta h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 1.9rem); }

    /* lock screen */
    .lock-screen { position: fixed; inset: 0; z-index: 90; background: rgba(0,23,46,.55);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .lock-card { background: var(--page); border: 1px solid var(--hairline); border-radius: 1rem;
      padding: 2.2rem 2rem; max-width: 22rem; width: 100%; text-align: center;
      box-shadow: 0 24px 60px -24px rgba(0,23,46,.5); }
    .lock-card .lock-icon { font-size: 2rem; margin-bottom: .6rem; }
    .lock-card h2 { margin: 0 0 .4rem; font-size: 1.15rem; color: var(--ink); }
    .lock-card p { margin: 0 0 1.2rem; color: var(--ink-muted); font-size: .9rem; }
    .lock-card input { width: 100%; padding: .7rem .9rem; border: 1px solid var(--hairline);

    .lock-card input:focus { outline: 2px solid var(--accent-bright); outline-offset: 1px; border-color: var(--accent-bright); }
    .lock-card button { width: 100%; margin-top: .9rem; padding: .7rem; border: 0; border-radius: .55rem;

    .reader-layout { display: grid; grid-template-columns: 16rem 1fr; gap: 2.5rem; margin-top: 2.5rem; }
    @media (max-width: 900px) { .reader-layout { grid-template-columns: 1fr; } }
    .toc-panel { border: 1px solid var(--hairline); border-radius: .9rem; background: var(--page);

    .toc-panel button { display: block; width: 100%; text-align: left; padding: .5rem 1.1rem;

    .toc-panel button:hover { background: var(--page-tint); }
    .toc-panel button.active { background: var(--page-tint); color: var(--accent); font-weight: 600; }
    .reader-main { min-width: 0; }
    .chapter { background: var(--page); border: 1px solid var(--hairline); border-radius: .9rem;

    @media (max-width: 640px) { .chapter { padding: 1.4rem 1.2rem 1.6rem; } }
    .chapter h1, .chapter h2 { color: var(--ink); letter-spacing: -0.01em; }

    .chapter code:not(pre code) { background: rgba(178,213,255,.32); color: var(--accent);

    .chapter table { display: block; width: max-content; max-width: 100%; overflow-x: auto;

    /* content polish */

      <form id="lock-form">
        <input type="password" id="pwd" placeholder="密码" autocomplete="off" aria-label="解锁密码">

      </form>
      <p class="lock-err" id="err">密码不正确，请重试。</p>

  <script>
  (function () {
    var SLUG = "designing-ai-systems";
    var PBKDF2_ITERS = 150000;
    var book = null;
    var current = -1;

    var lock = document.getElementById("lock");
    var err = document.getElementById("err");
    var btn = document.getElementById("unlock-btn");
    var readerEl = document.getElementById("reader");
    var statusEl = document.getElementById("status");
    var tocEl = document.getElementById("toc");
    var chapterEl = document.getElementById("chapter");
    var progressEl = document.getElementById("progress");
    var prevBtn = document.getElementById("prev");
    var nextBtn = document.getElementById("next");

    var b64ToBuf = function (b64) {
      var bin = atob(b64);
      var buf = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return buf;
    };

    function deriveKey(password, salt) {
      var enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
        .then(function (pk) {
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: PBKDF2_ITERS, hash: "SHA-256" },
            pk, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        });
    }

    function fetchAndDecrypt(password) {
      return fetch("../../assets/books/" + SLUG + ".bin")
        .then(function (r) {
          if (!r.ok) throw new Error("payload missing");
          return r.arrayBuffer();
        })
        .then(function (buf) {
          var bytes = new Uint8Array(buf);
          var salt = bytes.slice(0, 16);
          var iv = bytes.slice(16, 28);
          var tag = bytes.slice(28, 44);
          var ct = bytes.slice(44);
          return deriveKey(password, salt).then(function (key) {
            // AES-GCM in WebCrypto appends the tag to ciphertext
            var ctTag = new Uint8Array(ct.length + tag.length);
            ctTag.set(ct); ctTag.set(tag, ct.length);
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ctTag);
          });
        })
        .then(function (plain) {
          return JSON.parse(new TextDecoder().decode(plain));
        });
    }

    function renderToc() {
      tocEl.innerHTML = "";
      book.chapters.forEach(function (ch, i) {
        var li = document.createElement("li");
        var b = document.createElement("button");
        b.textContent = (i + 1) + ". " + ch.title;
        b.addEventListener("click", function () { show(i); });
        li.appendChild(b);
        tocEl.appendChild(li);
      });
    }

    function show(i) {
      if (!book || i < 0 || i >= book.chapters.length) return;
      current = i;
      var ch = book.chapters[i];
      chapterEl.innerHTML = ch.html;
      chapterEl.scrollTop = 0;
      progressEl.textContent = "第 " + (i + 1) + " / " + book.chapters.length + " 章 · " + ch.title;
      var btns = tocEl.querySelectorAll("button");
      btns.forEach(function (b, j) { b.classList.toggle("active", j === i); });
      prevBtn.disabled = i === 0;
      nextBtn.disabled = i === book.chapters.length - 1;
      var active = tocEl.querySelector("button.active");
      if (active) active.scrollIntoView({ block: "nearest" });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function unlock() {
      lock.hidden = true;
      readerEl.hidden = false;
      statusEl.hidden = true;
      renderToc();
      show(0);
    }

    document.getElementById("lock-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pwd = document.getElementById("pwd").value;
      if (!pwd) return;
      btn.disabled = true;
      btn.textContent = "解锁中…";
      err.classList.remove("show");
      fetchAndDecrypt(pwd)
        .then(function (data) {
          book = data;
          try { sessionStorage.setItem("books-unlocked", "1"); } catch (e) {}
          unlock();
        })
        .catch(function () {
          err.classList.add("show");
          btn.disabled = false;
          btn.textContent = "解锁阅读";
        });
    });

    prevBtn.addEventListener("click", function () { show(current - 1); });
    nextBtn.addEventListener("click", function () { show(current + 1); });
  })();
  </script>
