  <script>
  (function () {
    var SLUG = "moe-handbook";
    var book = null;
    var current = -1;

    var readerEl = document.getElementById("reader");
    var statusEl = document.getElementById("status");
    var tocEl = document.getElementById("toc");
    var chapterEl = document.getElementById("chapter");
    var progressEl = document.getElementById("progress");
    var prevBtn = document.getElementById("prev");
    var nextBtn = document.getElementById("next");

    function fetchBook() {
      return fetch("../../assets/books/" + SLUG + ".bin")
        .then(function (r) {
          if (!r.ok) throw new Error("payload missing");
          return r.json();
        });
    }


    function renderToc() {
      tocEl.innerHTML = "";
      book.chapters.forEach(function (ch, i) {
        var li = document.createElement("li");
        var b = document.createElement("button");
        b.textContent = (i + 1) + ". " + ch.title;
        b.addEventListener("click", function () { show(i); });
        li.appendChild(b);
        tocEl.appendChild(li);
      });
    }

    function show(i) {
      if (!book || i < 0 || i >= book.chapters.length) return;
      current = i;
      var ch = book.chapters[i];
      chapterEl.innerHTML = ch.html;
      renderMath();
      chapterEl.scrollTop = 0;
      progressEl.textContent = "第 " + (i + 1) + " / " + book.chapters.length + " 章 · " + ch.title;
      var btns = tocEl.querySelectorAll("button");
      btns.forEach(function (b, j) { b.classList.toggle("active", j === i); });
      prevBtn.disabled = i === 0;
      nextBtn.disabled = i === book.chapters.length - 1;
      var active = tocEl.querySelector("button.active");
      if (active) active.scrollIntoView({ block: "nearest" });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderMath() {
      if (typeof renderMathInElement === "function" && current >= 0) {
        renderMathInElement(chapterEl, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });
      }
    }

    function unlock() {
      readerEl.hidden = false;
      statusEl.hidden = true;
      renderToc();
      var initialCh = parseInt(location.hash.slice(1)) || 0;
      show(initialCh < book.chapters.length ? initialCh : 0);
      setTimeout(renderMath, 300);
      setTimeout(renderMath, 1500);
    }

    fetchBook()
      .then(function (data) {
        book = data;
        unlock();
      })
      .catch(function (e) {
        statusEl.hidden = false;
        statusEl.textContent = "加载失败：" + (e && e.message || e);
      });

    prevBtn.addEventListener("click", function () { show(current - 1); });
    nextBtn.addEventListener("click", function () { show(current + 1); });
  })();
  </script>
