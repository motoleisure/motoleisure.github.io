<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="鹈鹕骑车 千刀/opus-5 封面">
  <defs>
    <linearGradient id="o5Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb8e8"/><stop offset=".55" stop-color="#9adcf2"/><stop offset="1" stop-color="#d9f2f7"/>
    </linearGradient>
    <linearGradient id="o5Sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9fc4"/><stop offset="1" stop-color="#57c3d6"/>
    </linearGradient>
    <linearGradient id="o5Road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7686"/><stop offset="1" stop-color="#8d94a3"/>
    </linearGradient>
    <linearGradient id="o5Body" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f6efe0"/><stop offset="1" stop-color="#dfd2bb"/>
    </linearGradient>
    <linearGradient id="o5Beak" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffc24d"/><stop offset="0.6" stop-color="#f79c2a"/><stop offset="1" stop-color="#e07c18"/>
    </linearGradient>
    <linearGradient id="o5Gular" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffb43d"/><stop offset="1" stop-color="#e5711a"/>
    </linearGradient>
    <linearGradient id="o5Helm" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4ad0c0"/><stop offset="1" stop-color="#1d8c8e"/>
    </linearGradient>
    <radialGradient id="o5Shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d3b52" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1d3b52" stop-opacity="0"/>
    </radialGradient>
    <g id="o5Wheel">
      <circle r="58" fill="none" stroke="#26292f" stroke-width="8"/>
      <circle r="58" fill="none" stroke="#3d434d" stroke-width="8" stroke-dasharray="5 8"/>
      <circle r="51" fill="none" stroke="#e9b944" stroke-width="3.5"/>
      <g stroke="#cfd6e0" stroke-width="1.5">
        <line x1="50" y1="0" x2="-50" y2="0"/><line x1="43.3" y1="25" x2="-43.3" y2="-25"/>
        <line x1="25" y1="43.3" x2="-25" y2="-43.3"/><line x1="0" y1="50" x2="0" y2="-50"/>
        <line x1="-25" y1="43.3" x2="25" y2="-43.3"/><line x1="-43.3" y1="25" x2="43.3" y2="-25"/>
      </g>
      <circle r="6.5" fill="#4c525c"/><circle r="2.5" fill="#dfe5ee"/>
    </g>
    <g id="o5Cloud" fill="#fff">
      <ellipse cx="0" cy="0" rx="34" ry="15"/><ellipse cx="-23" cy="5" rx="20" ry="10"/>
      <ellipse cx="21" cy="6" rx="22" ry="11"/><ellipse cx="3" cy="-11" rx="21" ry="14"/>
    </g>
    <g id="o5Palm">
      <path d="M0 0 C -4 -26 1 -50 10 -70" fill="none" stroke="#8d6a44" stroke-width="6" stroke-linecap="round"/>
      <g fill="none" stroke="#2f8b4e" stroke-width="7" stroke-linecap="round">
        <path d="M10 -70 C -5 -82 -19 -80 -29 -69"/><path d="M10 -70 C -2 -90 8 -99 21 -101"/>
        <path d="M10 -70 C 23 -88 39 -88 49 -77"/><path d="M10 -70 C 27 -74 41 -67 47 -57"/>
        <path d="M10 -70 C -6 -70 -19 -61 -25 -50"/>
      </g>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="630" fill="url(#o5Sky)"/>
  <!-- sun -->
  <g opacity="0.9">
    <circle cx="980" cy="90" r="52" fill="#fff6cf" opacity="0.35"/>
    <circle cx="980" cy="90" r="36" fill="#fff3b8" opacity="0.55"/>
    <circle cx="980" cy="90" r="25" fill="#fffbe8"/>
  </g>
  <!-- clouds -->
  <g class="clouds" opacity="0.9">
    <use href="#o5Cloud" x="140" y="70" transform="scale(1.1)"/>
    <use href="#o5Cloud" x="440" y="44" transform="scale(0.8)" opacity="0.85"/>
    <use href="#o5Cloud" x="780" y="110" transform="scale(1.25)" opacity="0.7"/>
  </g>
  <!-- hills far -->
  <g fill="#7fa8bf" opacity="0.75">
    <path d="M0 410 C 80 386 140 372 200 376 C 260 380 300 400 360 396 C 420 392 460 362 520 358 C 580 354 620 384 680 390 C 740 396 780 376 840 370 C 900 364 960 390 1020 396 C 1080 402 1140 386 1200 392 L1200 420 L0 420 Z"/>
  </g>
  <!-- sea -->
  <rect x="0" y="416" width="1200" height="40" fill="url(#o5Sea)"/>
  <g stroke="#bfeaf2" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M60 432 q10 -4 20 0 t20 0"/><path d="M360 440 q10 -4 20 0 t20 0"/>
    <path d="M660 430 q10 -4 20 0 t20 0"/><path d="M960 438 q10 -4 20 0 t20 0"/>
  </g>
  <!-- dune -->
  <path d="M0 452 C 70 440 130 434 190 438 C 250 442 292 456 350 452 C 408 448 442 432 500 430 C 558 428 596 446 654 450 C 712 454 748 440 806 437 C 862 434 880 446 900 452 L900 461 L0 461 Z" fill="#e7d3a6"/>
  <!-- palms -->
  <use href="#o5Palm" x="160" y="458"/>
  <use href="#o5Palm" x="960" y="466" transform="scale(0.82)"/>
  <!-- road -->
  <rect x="0" y="452" width="1200" height="10" fill="#cbb98c"/>
  <rect x="0" y="460" width="1200" height="72" fill="url(#o5Road)"/>
  <rect x="0" y="460" width="1200" height="3" fill="#5b6270" opacity="0.7"/>
  <rect x="0" y="530" width="1200" height="6" fill="#cbb98c"/>
  <line x1="0" y1="496" x2="1200" y2="496" stroke="#e8e2cf" stroke-width="4" stroke-dasharray="96 84" opacity="0.7"/>

  <!-- rider + bicycle (static snapshot) -->
  <g class="rig" transform="translate(150,30)">
    <!-- contact shadow -->
    <g transform="translate(412,455)"><ellipse rx="172" ry="13" fill="url(#o5Shade)"/></g>
    <!-- rear wheel -->
    <g transform="translate(320,396)"><g><use href="#o5Wheel"/><circle cx="0" cy="-46" r="3" fill="#e2574c"/></g></g>
    <!-- front wheel -->
    <g transform="translate(510,396)"><g><use href="#o5Wheel"/><circle cx="0" cy="-46" r="3" fill="#e2574c"/></g></g>
    <!-- far crank -->
    <g transform="translate(392,408)"><rect x="-29" y="-3.5" width="29" height="7" rx="3.5" fill="#1c1f25"/><g transform="translate(-27,0)"><rect x="-12" y="-4" width="24" height="8" rx="2.5" fill="#2b3038"/></g></g>
    <!-- frame -->
    <g fill="none" stroke="#a2352c" stroke-width="11" stroke-linecap="round">
      <path d="M392 408 L320 396 M392 408 L354 304 M320 396 L354 304 M392 408 L484 335"/>
      <path d="M466 277 C 430 300 392 310 356 304"/><path d="M484 335 Q 496 362 510 396"/>
    </g>
    <g fill="none" stroke="#e2574c" stroke-width="7" stroke-linecap="round">
      <path d="M392 408 L320 396 M392 408 L354 304 M320 396 L354 304 M392 408 L484 335"/>
      <path d="M466 277 C 430 300 392 310 356 304"/><path d="M484 335 Q 496 362 510 396"/>
      <path d="M466 277 L484 335" stroke-width="13"/>
    </g>
    <!-- handlebar + bell -->
    <g fill="none" stroke="#3d434d" stroke-width="7" stroke-linecap="round">
      <path d="M466 277 L470 258"/><path d="M470 258 C 479 240 476 230 464 230 C 452 230 448 238 454 246"/>
    </g>
    <circle cx="454" cy="246" r="6" fill="#2b3038"/>
    <g transform="translate(474,235)"><circle r="6" fill="#f7d04f"/><circle r="6" fill="none" stroke="#c9a52f" stroke-width="1.5"/></g>
    <!-- saddle -->
    <path d="M354 304 L352 297" stroke="#3d434d" stroke-width="6" stroke-linecap="round"/>
    <path d="M384 296 Q 366 289 344 289 Q 320 289 316 297 Q 320 305 344 305 Q 368 305 384 300 Z" fill="#8d6a44"/>
    <!-- chain -->
    <g fill="none" stroke="#565c68" stroke-width="3.4" stroke-dasharray="5 3">
      <path d="M395.6 386.3 L321.8 385.2"/><path d="M388.4 429.7 L318.2 406.9"/>
    </g>
    <circle cx="320" cy="396" r="11" fill="none" stroke="#565c68" stroke-width="4.5"/>
    <!-- crank + chainring -->
    <g transform="translate(392,408)"><circle r="22" fill="none" stroke="#f7d04f" stroke-width="4"/><circle r="22" fill="none" stroke="#c9a52f" stroke-width="4" stroke-dasharray="3 5.5"/><g stroke="#e9c243" stroke-width="3"><path d="M0 0 L15 15 M0 0 L-15 15 M0 0 L15 -15 M0 0 L-15 -15"/></g><rect x="0" y="-4" width="29" height="8" rx="4" fill="#2b3038"/><g transform="translate(27,0)"><circle r="3" fill="#7d8593"/><rect x="-13" y="-4.5" width="26" height="9" rx="2.5" fill="#4c525c"/></g></g><circle r="6" fill="#3d434d"/>
    <!-- front basket with fish -->
    <g><path d="M470 254 L466 277" stroke="#8d6a44" stroke-width="3.5" fill="none"/><g transform="translate(474,252)"><g transform="translate(20,-14) rotate(-18)"><ellipse rx="17" ry="8" fill="#9fc7d8"/><path d="M15 0 L27 -7 L27 7 Z" fill="#7fb0c6"/><circle cx="-9" cy="-2" r="1.8" fill="#22323c"/></g><g transform="translate(46,-9) rotate(-8)"><ellipse rx="15" ry="7" fill="#c6d9e2"/><path d="M13 0 L24 -6 L24 6 Z" fill="#a3bfcd"/><circle cx="-8" cy="-2" r="1.6" fill="#22323c"/></g><path d="M0 0 L70 0 L61 50 L9 50 Z" fill="#c99b5e"/><path d="M0 0 L70 0 L61 50 L9 50 Z" fill="none" stroke="#a37942" stroke-width="2.5"/><g stroke="#a37942" stroke-width="1.8" opacity="0.8"><path d="M2 12 L68 12 M4 24 L66 24 M6 36 L64 36"/><path d="M18 0 L15 50 M35 0 L35 50 M52 0 L55 50"/></g><rect x="-4" y="-6" width="78" height="8" rx="4" fill="#a37942"/></g></g>
  </g>

  <!-- model label -->
  <rect x="440" y="80" width="320" height="52" rx="26" fill="#00172e"/>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="2">千刀/opus-5</text>
</svg>