<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="鹈鹕骑车 GLM-5.2">
  <defs>
    <linearGradient id="coverSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC2A8"/><stop offset=".5" stop-color="#FFE3C8"/><stop offset="1" stop-color="#FFF1DC"/>
    </linearGradient>
    <linearGradient id="coverSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AD8EC"/><stop offset="1" stop-color="#5BB8D6"/>
    </linearGradient>
    <radialGradient id="coverSunG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE6A0" stop-opacity="1"/><stop offset="1" stop-color="#FFE6A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
