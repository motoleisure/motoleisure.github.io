<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Rebuilt blog, from 2015 to 2026">
  <rect width="1200" height="630" fill="#eef6fd"/>

  <!-- baseline grid -->
  <g stroke="#b2d5ff" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="180" x2="1100" y2="180"/>
    <line x1="100" y1="300" x2="1100" y2="300"/>
    <line x1="100" y1="420" x2="1100" y2="420"/>
  </g>
  <g fill="#b2d5ff" opacity="0.8">
    <circle cx="100" cy="560" r="5"/>
    <circle cx="1100" cy="560" r="5"/>
    <circle cx="100" cy="80" r="5"/>
    <circle cx="1100" cy="80" r="5"/>
  </g>

  <!-- dashed hover-frame motif -->
  <rect x="150" y="90" width="900" height="450" rx="18" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="10 12" opacity="0.45"/>

  <!-- year tag -->
  <rect x="440" y="140" width="320" height="52" rx="26" fill="#00172e"/>
  <text x="600" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="6">2015 → 2026</text>

  <!-- giant editorial Aa -->
  <text x="600" y="452" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="300" font-weight="600" fill="#00172e" letter-spacing="-8">Aa</text>

  <!-- indigo caret -->
  <rect x="836" y="250" width="18" height="200" rx="6" fill="#4f46e5"/>
</svg>
