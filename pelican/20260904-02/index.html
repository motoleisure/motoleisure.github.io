  <style id="pel-anim-style">

    .pel-btn {
      appearance: none;

      font-size: 14px;

      background: #E8553A;
      box-shadow: 0 4px 12px rgba(232,85,58,.4);
      transition: transform .12s, filter .12s;
      letter-spacing: .04em;
    }
    .pel-btn:hover { transform: translateY(-1px); }
    .pel-btn:active { transform: translateY(1px); }
    .pel-btn--gif {
      background: #047857;
      box-shadow: 0 4px 12px rgba(4,120,87,.4);
    }
    .pel-btn--gif:disabled {
      opacity: 0.5;

    }
    .pelican-hint {
      font-size: 12px;
      color: #7a4a3a;
      text-align: center;
      letter-spacing: .05em;
      margin: 0;
    }

    /* ===== 动画 ===== */
    .wheel {
      animation: kimiSpin 1s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kimiSpin { to { transform: rotate(360deg); } }

    .bike-body {
      animation: kimiBob 0.5s ease-in-out infinite alternate;
    }
    @keyframes kimiBob {
      from { transform: translateY(0); }
      to   { transform: translateY(-6px); }
    }

    .crank {
      animation: kimiSpin 1s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .leg-front {
      animation: kimiLegUp 1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: top center;
    }
    .leg-back {
      animation: kimiLegUp 1s ease-in-out infinite;
      animation-delay: -0.5s;
      transform-box: fill-box;
      transform-origin: top center;
    }
    @keyframes kimiLegUp {
      0%, 100% { transform: rotate(12deg); }
      50%      { transform: rotate(-18deg); }
    }

    .pelican {
      animation: kimiBob 0.5s ease-in-out infinite alternate;
    }

    .wing {
      animation: kimiFlap 0.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: left center;
    }
    @keyframes kimiFlap {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-25deg); }
    }

    .head {
      animation: kimiNod 1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: bottom left;
    }
    @keyframes kimiNod {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(4deg); }
    }

    .cloud1 { animation: kimiDrift 14s linear infinite; }
    .cloud2 { animation: kimiDrift 20s linear infinite; animation-delay: -8s; }
    @keyframes kimiDrift {
      from { transform: translateX(-250px); }
      to   { transform: translateX(1100px); }
    }

    .rider-group {
      animation: kimiRide 9s linear infinite;
    }
    @keyframes kimiRide {
      from { transform: translateX(1050px); }
      to   { transform: translateX(-450px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pelican-frame svg * { animation-play-state: paused !important; }
    }
  </style>

  <script>
  /* ===== GIF 导出 ===== */
  (function () {
    var btn = document.getElementById('exportGif');
    var svg = document.querySelector('.pelican-frame svg');
    if (!btn || !svg) return;

    var animQuery = '.wheel,.crank,.leg-front,.leg-back,.pelican,.wing,.head,.cloud1,.cloud2,.rider-group,.bike-body';
    var animStyleEl = document.getElementById('pel-anim-style');
    var animCSS = animStyleEl ? animStyleEl.textContent : '';

    function loadGifshot() {
      return new Promise(function (resolve, reject) {
        if (window.gifshot) { resolve(); return; }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '⏳ 准备…';

      var duration = 1.0;
      var fps = 24;
      var total = Math.ceil(duration * fps);
      var W = 750, H = 390;
      var frames = [];
      var idx = 0;
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');

      var animEls = Array.prototype.slice.call(svg.querySelectorAll(animQuery));
      var saved = animEls.map(function (el) {
        return {
          delay: el.style.animationDelay || '',
          state: el.style.animationPlayState || ''
        };
      });

      loadGifshot().then(function () {
        function next() {
          if (idx >= total) {
            animEls.forEach(function (el, i) {
              el.style.animationDelay = saved[i].delay;
              el.style.animationPlayState = saved[i].state;
            });
            btn.textContent = '⏳ 合成 GIF…';
            gifshot.createGIF({
              images: frames,
              gifWidth: W,
              gifHeight: H,
              interval: 0.042,
              numFrames: total,
              sampleInterval: 10
            }, function (obj) {
              if (!obj.error) {
                var a = document.createElement('a');
                a.href = obj.image;
                a.download = 'pelican-kimi-k3.gif';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                btn.disabled = false;
                btn.textContent = '📷 导出 GIF';
              } else {
                console.error('gifshot error:', obj.error);
                btn.textContent = '❌ 失败，刷新重试';
                btn.disabled = false;
                setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
              }
            });
            return;
          }

          var t = (idx / total) * duration;
          animEls.forEach(function (el) {
            var orig = parseFloat(getComputedStyle(el).animationDelay) || 0;
            el.style.animationDelay = '-' + (Math.abs(orig) + t) + 's';
            el.style.animationPlayState = 'paused';
          });

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              btn.textContent = '⏳ 帧 ' + (idx + 1) + '/' + total;
              ctx.clearRect(0, 0, W, H);
              ctx.drawImage(svg, 0, 0, W, H);
              frames.push(canvas.toDataURL('image/png'));
              idx++;
              next();
            });
          });
        }
        next();
      }).catch(function () {
        btn.textContent = '❌ 加载失败，刷新重试';
        btn.disabled = false;
        setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
      });
    });
  })();
  </script>
