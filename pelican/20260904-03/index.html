      font-size: 14px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 999px;
      color: #fff;
      background: #E8553A;
      box-shadow: 0 4px 12px rgba(232,85,58,.4);
      transition: transform .12s, filter .12s;
      letter-spacing: .04em;
    }
    .pel-btn:hover { transform: translateY(-1px); }
    .pel-btn:active { transform: translateY(1px); }
    .pel-btn--gif {
      background: #047857;
      box-shadow: 0 4px 12px rgba(4,120,87,.4);
    }
    .pel-btn--gif:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pelican-hint {
      font-size: 12px;
      color: #7a4a3a;
      text-align: center;
      letter-spacing: .05em;
      margin: 0;
    }

    /* ===== 动画 ===== */
    :root {
      --crank: 1.2s;
      --wheel: 0.6s;
      --bob: 0.6s;
    }

    .sx { will-change: transform; }
    @keyframes opSx900 { to { transform: translateX(-900px); } }
    @keyframes opSx600 { to { transform: translateX(-600px); } }
    @keyframes opSx480 { to { transform: translateX(-480px); } }
    @keyframes opSx320 { to { transform: translateX(-320px); } }
    @keyframes opSx180 { to { transform: translateX(-180px); } }
    @keyframes opDash { to { stroke-dashoffset: -180; } }

    .cloudsA { animation: opSx900 49s linear infinite; }
    .hillsFar { animation: opSx900 14.8s linear infinite; }
    .hillsMid { animation: opSx900 4.9s linear infinite; }
    .bushes { animation: opSx600 1.98s linear infinite; }
    .speckle { animation: opSx480 0.79s linear infinite; }
    .grass { animation: opSx320 0.46s linear infinite; }
    .dashes { animation: opDash 0.30s linear infinite; }

    .bob { animation: opBob var(--bob) ease-in-out infinite; will-change: transform; }
    @keyframes opBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.4px); } }

    .shadow { animation: opShpulse var(--bob) ease-in-out infinite; }
    @keyframes opShpulse { 0%,100% { opacity: .30; transform: scale(1,1); } 50% { opacity: .20; transform: scale(.94,.86); } }

    .pouch { animation: opPouch calc(var(--crank)*.5) ease-in-out infinite; }
    @keyframes opPouch { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(4.5deg); } }

    .tail { animation: opTail calc(var(--crank)*.5) ease-in-out infinite; }
    @keyframes opTail { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-4deg); } }

    .wingFar { animation: opFlap .34s ease-in-out infinite; }
    @keyframes opFlap { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }

    .lid { animation: opBlink 4.3s steps(1,end) infinite; }
    @keyframes opBlink { 0%,95% { transform: scaleY(0); } 96%,98% { transform: scaleY(1); } 99%,100% { transform: scaleY(0); } }

    .puff { animation: opPuff .62s linear infinite; }
    .puff:nth-of-type(2) { animation-delay: .21s; }
    .puff:nth-of-type(3) { animation-delay: .41s; }
    @keyframes opPuff { 0% { opacity:0; transform:translate(0,0); } 20% { opacity:.4; } 100% { opacity:0; transform:translate(50px,-20px); } }

    .zip { animation: opZip 1.2s linear infinite; }
    @keyframes opZip { 0% { opacity: .6; } 100% { opacity: 0; } }

    .gull { animation: opGull 4s ease-in-out infinite; }
    @keyframes opGull { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

    .wheel { animation: opSpin var(--wheel) linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes opSpin { to { transform: rotate(360deg); } }

    .crank { animation: opSpin var(--crank) linear infinite; transform-box: fill-box; transform-origin: center; }
    .crank.far { animation-delay: calc(var(--crank) * -0.5); }
    .plat { transform-box: fill-box; transform-origin: center; animation: opPlatSpin var(--crank) linear infinite; }
    .crank.far .plat { animation-delay: calc(var(--crank) * -0.5); }
    @keyframes opPlatSpin { to { transform: rotate(-360deg); } }

    .chain { animation: opChain var(--crank) linear infinite; transform-box: fill-box; transform-origin: 280px 378px; }
    @keyframes opChain { to { transform: rotate(360deg); } }

    .thigh { transform-box: fill-box; transform-origin: 280px 320px; animation: opThighIK var(--crank) linear infinite; }
    .thigh.far { animation-delay: calc(var(--crank) * -0.5); }
    @keyframes opThighIK {
      0% { transform: rotate(-32deg); } 25% { transform: rotate(-38deg); } 50% { transform: rotate(-32deg); }
      75% { transform: rotate(-26deg); } 100% { transform: rotate(-32deg); }
    }

    .shin { transform-box: fill-box; transform-origin: 280px 348px; animation: opShinIK var(--crank) linear infinite; }
    .shin.far { animation-delay: calc(var(--crank) * -0.5); }
    @keyframes opShinIK {
      0% { transform: rotate(56deg); } 25% { transform: rotate(84deg); } 50% { transform: rotate(56deg); }
      75% { transform: rotate(28deg); } 100% { transform: rotate(56deg); }
    }

    .sole { transform-box: fill-box; transform-origin: 280px 370px; animation: opSoleIK var(--crank) linear infinite; }
    .sole.far { animation-delay: calc(var(--crank) * -0.5); }
    @keyframes opSoleIK {
      0% { transform: rotate(-30deg); } 25% { transform: rotate(-18deg); } 50% { transform: rotate(-30deg); }
      75% { transform: rotate(-42deg); } 100% { transform: rotate(-30deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pelican-frame svg * { animation-play-state: paused !important; }
    }
  </style>

  <script>
  /* ===== GIF 导出 ===== */
  (function () {
    var btn = document.getElementById('exportGif');
    var svg = document.querySelector('.pelican-frame svg');
    if (!btn || !svg) return;

    var animQuery = '.wheel,.crank,.plat,.chain,.thigh,.shin,.sole,.bob,.shadow,.pouch,.tail,.wingFar,.lid,.puff,.zip,.gull,.cloudsA,.hillsFar,.hillsMid,.bushes,.speckle,.grass,.dashes,.sx';
    var animStyleEl = document.getElementById('pel-anim-style');
    var animCSS = animStyleEl ? animStyleEl.textContent : '';

    function loadGifshot() {
      return new Promise(function (resolve, reject) {
        if (window.gifshot) { resolve(); return; }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '⏳ 准备…';

      var duration = 1.2;
      var fps = 24;
      var total = Math.ceil(duration * fps);
      var W = 780, H = 390;
      var frames = [];
      var idx = 0;
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');

      var animEls = Array.prototype.slice.call(svg.querySelectorAll(animQuery));
      var saved = animEls.map(function (el) {
        return {
          delay: el.style.animationDelay || '',
          state: el.style.animationPlayState || ''
        };
      });

      loadGifshot().then(function () {
        function next() {
          if (idx >= total) {
            animEls.forEach(function (el, i) {
              el.style.animationDelay = saved[i].delay;
              el.style.animationPlayState = saved[i].state;
            });
            btn.textContent = '⏳ 合成 GIF…';
            gifshot.createGIF({
              images: frames,
              gifWidth: W,
              gifHeight: H,
              interval: 0.042,
              numFrames: total,
              sampleInterval: 10
            }, function (obj) {
              if (!obj.error) {
                var a = document.createElement('a');
                a.href = obj.image;
                a.download = 'pelican-opus-5.gif';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                btn.disabled = false;
                btn.textContent = '📷 导出 GIF';
              } else {
                console.error('gifshot error:', obj.error);
                btn.textContent = '❌ 失败，刷新重试';
                btn.disabled = false;
                setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
              }
            });
            return;
          }

          var t = (idx / total) * duration;
          animEls.forEach(function (el) {
            var orig = parseFloat(getComputedStyle(el).animationDelay) || 0;
            el.style.animationDelay = '-' + (Math.abs(orig) + t) + 's';
            el.style.animationPlayState = 'paused';
          });

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              btn.textContent = '⏳ 帧 ' + (idx + 1) + '/' + total;
              ctx.clearRect(0, 0, W, H);
              ctx.drawImage(svg, 0, 0, W, H);
              frames.push(canvas.toDataURL('image/png'));
              idx++;
              next();
            });
          });
        }
        next();
      }).catch(function () {
        btn.textContent = '❌ 加载失败，刷新重试';
        btn.disabled = false;
        setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
      });
    });
  })();
  </script>
</body>
</html>
