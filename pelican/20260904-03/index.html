    .dashes { animation: dash 0.30s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -180; } }
    .bob { animation: bob var(--bob) ease-in-out infinite; will-change: transform; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.4px); } }
    .shadow { animation: shpulse var(--bob) ease-in-out infinite; }
    @keyframes shpulse { 0%,100% { opacity: .30; transform: scale(1,1); } 50% { opacity: .20; transform: scale(.94,.86); } }
    .pouch { animation: pouch calc(var(--crank)*.5) ease-in-out infinite; }
    @keyframes pouch { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(4.5deg); } }
    .tail { animation: tail calc(var(--crank)*.5) ease-in-out infinite; }
    @keyframes tail { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-4deg); } }
    .wingFar { animation: flap .34s ease-in-out infinite; }
    @keyframes flap { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
    .lid { animation: blink 4.3s steps(1,end) infinite; }
    @keyframes blink { 0%,95% { transform: scaleY(0); } 96%,98% { transform: scaleY(1); } 99%,100% { transform: scaleY(0); } }
    .puff { animation: puff .62s linear infinite; }
    .puff:nth-of-type(2) { animation-delay: .21s; }
    .puff:nth-of-type(3) { animation-delay: .42s; }
    @keyframes puff { 0% { opacity: .50; transform: translate(0,0) scale(.35); } 100% { opacity: 0; transform: translate(-92px,-26px) scale(1.5); } }
    .zip { animation: zip .5s linear infinite; }
    .zip:nth-of-type(2) { animation-delay: .17s; }
    .zip:nth-of-type(3) { animation-delay: .33s; }
    @keyframes zip { 0% { opacity: 0; transform: translateX(40px) scaleX(.4); } 25% { opacity: .75; } 100% { opacity: 0; transform: translateX(-260px) scaleX(1.3); } }
    .gull { animation: gullflap .9s ease-in-out infinite; }
    @keyframes gullflap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
    .rig * { transform-origin: 0 0; }
    .wheel { animation: spin var(--wheel) linear infinite; }
    .crank { animation: spin var(--crank) linear infinite; }
    .plat { animation: spinBack var(--crank) linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinBack { to { transform: rotate(-360deg); } }
    .chain { animation: chain calc(var(--crank)*.29) linear infinite; }
    @keyframes chain { to { stroke-dashoffset: -40; } }
    .thigh { animation: thigh var(--crank) linear infinite; }
    .shin { animation: shin var(--crank) linear infinite; }
    .sole { animation: sole var(--crank) linear infinite; }
    .far { animation-delay: calc(var(--crank) * -0.5); }
    @keyframes thigh { 0%,100% { transform: rotate(-59.7deg); } 12.5% { transform: rotate(-41.4deg); } 25% { transform: rotate(-30.7deg); } 37.5% { transform: rotate(-33.9deg); } 50% { transform: rotate(-44.0deg); } 62.5% { transform: rotate(-59.0deg); } 75% { transform: rotate(-72.7deg); } 87.5% { transform: rotate(-73.0deg); } }
    @keyframes shin { 0%,100% { transform: rotate(65.1deg); } 12.5% { transform: rotate(41.4deg); } 25% { transform: rotate(36.2deg); } 37.5% { transform: rotate(56.3deg); } 50% { transform: rotate(81.6deg); } 62.5% { transform: rotate(100.6deg); } 75% { transform: rotate(103.9deg); } 87.5% { transform: rotate(89.4deg); } }
    @keyframes sole { 0%,100% { transform: rotate(-5.5deg); } 12.5% { transform: rotate(-0.1deg); } 25% { transform: rotate(-5.6deg); } 37.5% { transform: rotate(-22.4deg); } 50% { transform: rotate(-37.6deg); } 62.5% { transform: rotate(-41.7deg); } 75% { transform: rotate(-31.3deg); } 87.5% { transform: rotate(-16.4deg); } }
    @media (prefers-reduced-motion:reduce) { .pelican-frame svg * { animation: none !important; } }
  </style>

  <script>
  /* ===== GIF 导出 ===== */
  (function () {
    var btn = document.getElementById('exportGif');
    var svg = document.querySelector('.pelican-frame svg');
    if (!btn || !svg) return;

    var animQuery = '.wheel,.crank,.plat,.chain,.thigh,.shin,.sole,.far,.bob,.shadow,.pouch,.tail,.wingFar,.lid,.puff,.zip,.gull,.cloudsA,.hillsFar,.hillsMid,.bushes,.speckle,.grass,.dashes,.sx';
    var animStyleEl = document.getElementById('pel-anim-style');
    var animCSS = animStyleEl ? animStyleEl.textContent : '';

    function loadGifshot() {
      return new Promise(function (resolve, reject) {
        if (window.gifshot) { resolve(); return; }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '⏳ 准备…';

      var duration = 1.2;
      var fps = 24;
      var total = Math.ceil(duration * fps);
      var W = 675, H = 375;
      var frames = [];
      var idx = 0;
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');

      var animEls = Array.prototype.slice.call(svg.querySelectorAll(animQuery));
      var saved = animEls.map(function (el) {
        return {
          delay: el.style.animationDelay || '',
          state: el.style.animationPlayState || ''
        };
      });

      loadGifshot().then(function () {
        function next() {
          if (idx >= total) {
            animEls.forEach(function (el, i) {
              el.style.animationDelay = saved[i].delay;
              el.style.animationPlayState = saved[i].state;
            });
            btn.textContent = '⏳ 合成 GIF…';
            gifshot.createGIF({
              images: frames,
              gifWidth: W,
              gifHeight: H,
              interval: 0.042,
              numFrames: total,
              sampleInterval: 10
            }, function (obj) {
              if (!obj.error) {
                var a = document.createElement('a');
                a.href = obj.image;
                a.download = 'pelican-opus-5.gif';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                btn.disabled = false;
                btn.textContent = '📷 导出 GIF';
              } else {
                console.error('gifshot error:', obj.error);
                btn.textContent = '❌ 失败，刷新重试';
                btn.disabled = false;
                setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
              }
            });
            return;
          }

          var t = (idx / total) * duration;
          animEls.forEach(function (el) {
            var orig = parseFloat(getComputedStyle(el).animationDelay) || 0;
            el.style.animationDelay = '-' + (Math.abs(orig) + t) + 's';
            el.style.animationPlayState = 'paused';
          });

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              btn.textContent = '⏳ 帧 ' + (idx + 1) + '/' + total;
              ctx.clearRect(0, 0, W, H);
              ctx.drawImage(svg, 0, 0, W, H);
              frames.push(canvas.toDataURL('image/png'));
              idx++;
              next();
            });
          });
        }
        next();
      }).catch(function () {
        btn.textContent = '❌ 加载失败，刷新重试';
        btn.disabled = false;
        setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
      });
    });
  })();
  </script>
</body>
