    .pel-wheel { transform-box: view-box; transform-origin: 300px 470px; animation: pelSpin 1.1s linear infinite; }
    .pel-wheel.pel-f { transform-origin: 560px 470px; }
    @keyframes pelSpin { to { transform: rotate(360deg); } }

    .pel-crank { transform-box: view-box; transform-origin: 430px 470px; animation: pelSpin 1.1s linear infinite; }
    .pel-crank.pel-far { animation-delay: -.55s; }
    .pel-pedal { transform-box: view-box; transform-origin: 430px 444px; animation: pelSpinB 1.1s linear infinite; }
    .pel-crank.pel-far .pel-pedal { animation-delay: -.55s; }
    @keyframes pelSpinB { to { transform: rotate(-360deg); } }

    .pel-thighN { transform-box: view-box; transform-origin: 420px 380px; animation: pelThighK 1.1s linear infinite; }
    .pel-shinN { transform-box: view-box; transform-origin: 420px 438px; animation: pelShinK 1.1s linear infinite; }
    .pel-footN { transform-box: view-box; transform-origin: 420px 502px; animation: pelFootK 1.1s linear infinite; }
    .pel-thighF { transform-box: view-box; transform-origin: 420px 380px; animation: pelThighK 1.1s linear infinite; animation-delay: -.55s; }
    .pel-shinF { transform-box: view-box; transform-origin: 420px 438px; animation: pelShinK 1.1s linear infinite; animation-delay: -.55s; }
    .pel-footF { transform-box: view-box; transform-origin: 420px 502px; animation: pelFootK 1.1s linear infinite; animation-delay: -.55s; }

    .pel-bob { transform-box: view-box; animation: pelBob 1.1s ease-in-out infinite; }
    @keyframes pelBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .pel-nod { transform-box: view-box; transform-origin: 470px 300px; animation: pelNod 1.1s ease-in-out infinite; animation-delay: -.3s; }
    @keyframes pelNod { 0%,100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
    .pel-arm { transform-box: view-box; transform-origin: 470px 314px; animation: pelArmW .55s ease-in-out infinite; }
    @keyframes pelArmW { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }

    .pel-pouch { transform-box: view-box; transform-origin: 510px 250px; animation: pelPouchW 1.1s ease-in-out infinite; }
    @keyframes pelPouchW { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .pel-fishTail { transform-box: fill-box; transform-origin: left center; animation: pelFish .4s ease-in-out infinite alternate; }
    @keyframes pelFish { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } }

    .pel-wind { opacity: 0; animation: pelWind .8s linear infinite; }
    .pel-w2 { animation-delay: .27s; }
    .pel-w3 { animation-delay: .53s; }
    @keyframes pelWind { 0% { opacity: 0; transform: translateX(20px); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateX(-30px); } }

    .pel-clouds { transform-box: view-box; animation: pelCloudDrift 22s linear infinite; }
    @keyframes pelCloudDrift { to { transform: translateX(-960px); } }
    .pel-hills { transform-box: view-box; animation: pelHillsDrift 7s linear infinite; }
    @keyframes pelHillsDrift { to { transform: translateX(-480px); } }
    .pel-ground { transform-box: view-box; animation: pelGroundDrift 1.1s linear infinite; }
    @keyframes pelGroundDrift { to { transform: translateX(-240px); } }
    .pel-dash { stroke-dasharray: 40 30; animation: pelDash 0.39s linear infinite; }
    @keyframes pelDash { to { stroke-dashoffset: 140; } }

    .pel-sun { transform-box: view-box; transform-origin: 760px 110px; animation: pelSunPulse 3s ease-in-out infinite; }
    @keyframes pelSunPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    /* 腿 IK 24 步/周 烘焙关键帧 */
    @keyframes pelThighK {
      0%{transform:rotate(-82.0deg)}4.17%{transform:rotate(-86.4deg)}8.33%{transform:rotate(-88.0deg)}12.5%{transform:rotate(-87.0deg)}16.67%{transform:rotate(-83.6deg)}20.83%{transform:rotate(-78.2deg)}25%{transform:rotate(-71.6deg)}29.17%{transform:rotate(-64.4deg)}33.33%{transform:rotate(-57.0deg)}37.5%{transform:rotate(-50.0deg)}41.67%{transform:rotate(-43.8deg)}45.83%{transform:rotate(-39.0deg)}50%{transform:rotate(-35.6deg)}54.17%{transform:rotate(-33.6deg)}58.33%{transform:rotate(-33.0deg)}62.5%{transform:rotate(-33.8deg)}66.67%{transform:rotate(-35.8deg)}70.83%{transform:rotate(-39.0deg)}75%{transform:rotate(-43.2deg)}79.17%{transform:rotate(-48.4deg)}83.33%{transform:rotate(-54.8deg)}87.5%{transform:rotate(-62.0deg)}91.67%{transform:rotate(-70.0deg)}95.83%{transform:rotate(-77.0deg)}100%{transform:rotate(-82.0deg)}
    }
    @keyframes pelShinK {
      0%{transform:rotate(120.0deg)}4.17%{transform:rotate(116.0deg)}8.33%{transform:rotate(109.6deg)}12.5%{transform:rotate(102.0deg)}16.67%{transform:rotate(94.0deg)}20.83%{transform:rotate(85.6deg)}25%{transform:rotate(77.4deg)}29.17%{transform:rotate(70.0deg)}33.33%{transform:rotate(63.8deg)}37.5%{transform:rotate(59.2deg)}41.67%{transform:rotate(56.4deg)}45.83%{transform:rotate(55.6deg)}50%{transform:rotate(57.0deg)}54.17%{transform:rotate(60.6deg)}58.33%{transform:rotate(66.0deg)}62.5%{transform:rotate(73.0deg)}66.67%{transform:rotate(80.6deg)}70.83%{transform:rotate(88.8deg)}75%{transform:rotate(96.8deg)}79.17%{transform:rotate(104.0deg)}83.33%{transform:rotate(110.0deg)}87.5%{transform:rotate(114.6deg)}91.67%{transform:rotate(117.6deg)}95.83%{transform:rotate(119.2deg)}100%{transform:rotate(120.0deg)}
    }
    @keyframes pelFootK {
      0%{transform:rotate(-26.0deg)}4.17%{transform:rotate(-19.0deg)}8.33%{transform:rotate(-12.6deg)}12.5%{transform:rotate(-7.6deg)}16.67%{transform:rotate(-3.8deg)}20.83%{transform:rotate(-1.2deg)}25%{transform:rotate(0.4deg)}29.17%{transform:rotate(1.2deg)}33.33%{transform:rotate(1.0deg)}37.5%{transform:rotate(-0.6deg)}41.67%{transform:rotate(-3.4deg)}45.83%{transform:rotate(-7.2deg)}50%{transform:rotate(-11.6deg)}54.17%{transform:rotate(-16.4deg)}58.33%{transform:rotate(-21.6deg)}62.5%{transform:rotate(-26.8deg)}66.67%{transform:rotate(-31.6deg)}70.83%{transform:rotate(-35.6deg)}75%{transform:rotate(-38.4deg)}79.17%{transform:rotate(-39.4deg)}83.33%{transform:rotate(-37.8deg)}87.5%{transform:rotate(-33.4deg)}91.67%{transform:rotate(-27.6deg)}95.83%{transform:rotate(-21.6deg)}100%{transform:rotate(-26.0deg)}
    }

    @media (prefers-reduced-motion: reduce) {
      .pelican-frame svg * { animation-play-state: paused !important; }
    }
  </style>

  <script>
  (function () {
    var musicBtn = document.getElementById('music');
    var muteBtn = document.getElementById('mute');
    var ctx, master, loopTimer, playing = false;

    var N = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00,
      G3: 196.00, A3: 220.00, C4b: 277.18, B3: 246.94
    };

    var melody = [
      ['E5', 1], ['D5', 1], ['C5', 2], ['G4', 1], ['A4', 1],
      ['C5', 1], ['D5', 1], ['E5', 2], ['D5', 1], ['C5', 1],
      ['B4', 2], ['A4', 1], ['G4', 1], ['E4', 2], ['G4', 1], ['A4', 1]
    ];
    var bass = [
      ['A3', 4], ['A3', 4], ['G3', 4], ['G3', 4],
      ['A3', 4], ['A3', 4], ['E4', 4], ['A3', 4]
    ];

    function note(c, dest, freq, dur, t, vol, type) {
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.05);
    }

    var stepIdx = 0;
    function playStep() {
      if (!playing) return;
      var t = ctx.currentTime + 0.02;
      var step = stepIdx;
      var m = melody[step % melody.length];
      if (m && m[0] !== '_') note(ctx, master, N[m[0]], m[1] * 0.2, t, 0.16, 'triangle');
      if (step % 2 === 0) {
        var b = bass[(step / 2) % bass.length];
        if (b) note(ctx, master, N[b[0]], b[1] * 0.2, t, 0.22, 'sine');
      }
      if (step % 4 === 0) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
        g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
      }
      if (step % 4 === 2) {
        var o2 = ctx.createOscillator(), g2 = ctx.createGain();
        o2.type = 'square'; o2.frequency.value = 3200;
        g2.gain.setValueAtTime(0.08, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 0.06);
      }
      stepIdx++;
    }

    function start() {
      if (playing) return;
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
      playing = true; stepIdx = 0;
      loopTimer = setInterval(playStep, 200);
      musicBtn.hidden = true; muteBtn.hidden = false;
    }
    function stop() {
      playing = false;
      if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
      if (master) {
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
      }
      musicBtn.hidden = false; muteBtn.hidden = true;
    }
    musicBtn.addEventListener('click', start);
    muteBtn.addEventListener('click', stop);
  })();

  /* ===== GIF 导出 ===== */
  (function () {
    var btn = document.getElementById('exportGif');
    var svg = document.querySelector('.pelican-frame svg');
    if (!btn || !svg) return;

    var animQuery = '.pel-wheel,.pel-crank,.pel-pedal,.pel-thighN,.pel-shinN,.pel-footN,.pel-thighF,.pel-shinF,.pel-footF,.pel-bob,.pel-nod,.pel-arm,.pel-pouch,.pel-fishTail,.pel-wind,.pel-clouds,.pel-hills,.pel-ground,.pel-dash,.pel-sun';

    // 加载 gifshot
    function loadGifshot() {
      return new Promise(function (resolve, reject) {
        if (window.gifshot) { resolve(); return; }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '⏳ 准备…';

      var duration = 1.1;
      var fps = 24;
      var total = Math.ceil(duration * fps);
      var W = 720, H = 435;
      var frames = [];
      var idx = 0;
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');

      var animEls = Array.prototype.slice.call(svg.querySelectorAll(animQuery));
      var saved = animEls.map(function (el) {
        return {
          delay: el.style.animationDelay || '',
          state: el.style.animationPlayState || ''
        };
      });

      loadGifshot().then(function () {
        function next() {
          if (idx >= total) {
            animEls.forEach(function (el, i) {
              el.style.animationDelay = saved[i].delay;
              el.style.animationPlayState = saved[i].state;
            });
            btn.textContent = '⏳ 合成 GIF…';
            gifshot.createGIF({
              images: frames,
              gifWidth: W,
              gifHeight: H,
              interval: 0.042,
              numFrames: total,
              sampleInterval: 10
            }, function (obj) {
              if (!obj.error) {
                var a = document.createElement('a');
                a.href = obj.image;
                a.download = 'pelican-glm5.2.gif';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                btn.disabled = false;
                btn.textContent = '📷 导出 GIF';
              } else {
                console.error('gifshot error:', obj.error);
                btn.textContent = '❌ 失败，刷新重试';
                btn.disabled = false;
                setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
              }
            });
            return;
          }

          // animation-delay 定位到第 idx 帧
          var t = (idx / total) * duration;
          animEls.forEach(function (el) {
            var orig = parseFloat(getComputedStyle(el).animationDelay) || 0;
            el.style.animationDelay = '-' + (Math.abs(orig) + t) + 's';
            el.style.animationPlayState = 'paused';
          });

          // 两步 RAF 等渲染完成
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              btn.textContent = '⏳ 帧 ' + (idx + 1) + '/' + total;
              // 直接绘制 SVG 元素到 canvas（Chrome/Firefox 支持）
              ctx.clearRect(0, 0, W, H);
              ctx.drawImage(svg, 0, 0, W, H);
              frames.push(canvas.toDataURL('image/png'));
              idx++;
              next();
            });
          });
        }
        next();
      }).catch(function () {
        btn.textContent = '❌ 加载失败，刷新重试';
        btn.disabled = false;
        setTimeout(function () { btn.textContent = '📷 导出 GIF'; }, 3000);
      });
    });
  })();
  </script>
